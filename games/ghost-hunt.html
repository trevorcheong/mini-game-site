<title>Ghost Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
/* =====================================================================
   CONFIG — edit these to tune difficulty and payout cost
   ===================================================================== */
const CLAIM_URL = "";   // amount & code are appended as ?amount=0.70&code=GHOST-XXXXXX
const CLAIM_OPEN_NEW_TAB = false;                 // true = open claim page in a new tab

const CONFIG = {
  GAME_TIME: 30,              // seconds per round
  REWARD_PER_GHOST: 0.10,     // RM per normal ghost
  GOLD_REWARD: 0.20,          // RM per lucky (golden) ghost
  MAX_REWARD: 2.00,           // RM cap — reaching it ends the round with a win

  // Flashlight (radius in px on a 390px-wide phone; scales with screen width)
  LIGHT_RADIUS_START: 104,
  LIGHT_RADIUS_END: 64,       // radius at the end of the round
  LIGHT_SHRINK_CURVE: 1.0,    // 1 = linear shrink, >1 = shrinks later, <1 = shrinks sooner

  // Ghosts
  MAX_GHOSTS: 2,              // ghosts hiding in the room at the same time
  GHOST_LIFE_START: 3.2,      // seconds a ghost stays at the start of the round
  GHOST_LIFE_END: 1.4,        // ...and at the end
  RESPAWN_DELAY_MIN: 0.4,    // gap before a new ghost appears (seconds)
  RESPAWN_DELAY_MAX: 1.1,
  FLOAT_CHANCE: 0.55,         // share of ghosts that drift instead of staying still
  FLOAT_SPEED_START: 16,      // px/s drift speed at start
  FLOAT_SPEED_END: 58,        // px/s drift speed at end
  GHOST_SIZE: 76,             // px on a 390px-wide phone
  CATCH_DWELL: 0.25,          // seconds the light must stay on a ghost to catch it
  CATCH_REACH: 0.6,           // how close to the light's centre a ghost must be (share of light radius)

  // Golden ghost
  GOLD_CHANCE: 0.07,          // chance that a new spawn is golden
  GOLD_LIFE: 1.7,             // seconds it stays

  // Bats
  BAT_CHANCE_PER_SEC: 0.22,   // chance per second that a bat flies in
  BAT_MAX: 2,
  BAT_PENALTY: 3,             // seconds removed when the light stays on a bat
  BAT_DWELL: 0.2,             // seconds of light on a bat before it bites
  BAT_FIRST_AFTER: 3,         // no bats during the first N seconds
  BAT_SPEED: 120,             // px/s

  // Atmosphere
  LIGHTNING_MIN: 6,           // seconds between lightning flashes
  LIGHTNING_MAX: 11,
  VOLUME: 0.5,                // master volume (0..1); everything is mixed quiet
  MUSIC_VOLUME: 0.7,          // background music level relative to sound effects (0..1)
  MUSIC_BPM: 112,             // background music tempo (speeds up in the last 5 seconds)
  DRAG_SPEED: 1.25            // how far the light moves per finger movement (1 = same distance)
};

/* Hook for your own system. Called when the player taps CLAIM NOW,
   just before the browser goes to CLAIM_URL. amount is a string like "0.70". */
function onClaim(amount, code) {
  // e.g. fetch("/api/claim", { method: "POST", body: JSON.stringify({ amount, code }) });
  console.log("onClaim", amount, code);
}
</script>
<style>
:root{
  color-scheme:dark;
  --ink:#0b0718; --plum:#24123f; --plum2:#341a5a; --panel:rgba(40,18,72,.72);
  --gold:#ffcf5a; --gold2:#ffb52e; --candle:#ffe39a; --teal:#59e0d0; --red:#ff5a6a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none}
body{position:fixed;inset:0;font-family:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;color:#fff;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;pointer-events:none}

#game{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;overflow:hidden;background:#140c2a}
@media (min-width:481px){#game{box-shadow:0 0 0 1px #2b1c4d,0 0 80px rgba(120,80,220,.25)}}

/* ---------- scene ---------- */
#scene,#ents,#darkCv,#fxCv,#fxDom,#stage,#flashW,#flashR{position:absolute;inset:0}
#bgFallback{position:absolute;inset:0;background:
  radial-gradient(circle at 55% 26%,#cfeff0 0 7%,rgba(140,220,220,.35) 7.5%,transparent 22%),
  linear-gradient(180deg,#2a1d52 0%,#22174a 55%,#1a1238 56%,#241a46 100%)}
#bgFallback::before{content:"";position:absolute;left:38%;top:14%;width:34%;height:40%;border-radius:40% 40% 4% 4%;
  background:linear-gradient(90deg,transparent 48%,#2a1d52 48% 52%,transparent 52%),linear-gradient(0deg,transparent 48%,#2a1d52 48% 52%,transparent 52%),rgba(110,200,210,.25)}
#bgFallback::after{content:"";position:absolute;left:6%;bottom:18%;width:34%;height:20%;border-radius:30% 30% 10% 10%;background:#3a2b5e;box-shadow:inset 0 -14px 0 #2d214b,260px -150px 0 -20px #2f2350}
#bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .6s}
#bgImg.ok{opacity:1}
.drape{position:absolute;pointer-events:none;opacity:.22;mix-blend-mode:screen;transform-origin:50% 0;
  background:linear-gradient(90deg,transparent,rgba(120,240,230,.55) 45%,transparent 70%);filter:blur(6px);animation:drape 6s ease-in-out infinite}
.drape.r{animation-delay:-3s;animation-duration:7s}
@keyframes drape{0%,100%{transform:skewX(0deg) translateX(0)}50%{transform:skewX(3deg) translateX(6px)}}
.web{position:absolute;top:0;width:34%;max-width:160px;pointer-events:none;opacity:.55;transform-origin:0 0;animation:sway 5s ease-in-out infinite}
.web.r{right:0;transform-origin:100% 0;animation-delay:-2.5s}
.web.l{left:0}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}
.web.r{animation-name:swayR}@keyframes swayR{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.2deg)}}
#spider{position:absolute;top:0;left:63%;width:2px;height:22%;background:linear-gradient(rgba(220,230,255,.5),rgba(220,230,255,.25));transform-origin:50% 0;animation:spider 4.5s ease-in-out infinite;pointer-events:none}
#spider::after{content:"";position:absolute;bottom:-10px;left:-7px;width:16px;height:14px;border-radius:50%;background:#1c1233;box-shadow:inset 0 -3px 0 #2c1f4d,-7px 2px 0 -5px #1c1233,7px 2px 0 -5px #1c1233}
@keyframes spider{0%,100%{transform:rotate(-3deg) scaleY(1)}50%{transform:rotate(3deg) scaleY(1.12)}}

/* ---------- entities ---------- */
#ents{pointer-events:none;transition:opacity .06s}
#ents.hide-ghosts .ghostish{opacity:0!important;transition:opacity .05s}
.ent{position:absolute;left:0;top:0;will-change:transform;opacity:0;transition:opacity .35s}
.ent.on{opacity:1}
.ent .inner{position:absolute;inset:0}
.ent img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ghostish .inner{filter:drop-shadow(0 0 10px rgba(190,220,255,.35))}
.gold .inner{filter:drop-shadow(0 0 14px rgba(255,200,70,.85))}
.ent.startled .inner{animation:startle .42s ease-out}
.ent.startled.lit .inner{animation:startle .42s ease-out,jitter .18s linear .42s infinite}
@keyframes startle{0%{transform:scale(1)}30%{transform:scale(1.18,1.1) rotate(-6deg)}55%{transform:scale(.95,1.04) rotate(5deg)}80%{transform:scale(1.04) rotate(-2deg)}100%{transform:scale(1.06)}}
@keyframes jitter{0%{transform:scale(1.06) translateX(0)}25%{transform:scale(1.06) translateX(-1.5px)}75%{transform:scale(1.06) translateX(1.5px)}100%{transform:scale(1.06) translateX(0)}}
.bang{position:absolute;left:62%;top:-10%;font-weight:700;font-size:20px;color:var(--candle);text-shadow:0 2px 0 #4a2a00,0 0 8px #ffb52e;opacity:0;transform:scale(.3);transition:transform .2s cubic-bezier(.3,1.8,.5,1),opacity .15s}
.ent.lit .bang{opacity:1;transform:scale(1)}
.ent.caught{transition:transform .35s ease-in,opacity .35s ease-in;opacity:0!important}
.ent.caught .inner{animation:caught .35s ease-in forwards}
@keyframes caught{to{transform:scale(1.6) translateY(-14px);filter:brightness(2)}}
.bat .inner{animation:flap .22s ease-in-out infinite alternate}
.bat.flip .inner{transform:scaleX(-1)}
@keyframes flap{from{transform:scaleY(1) }to{transform:scaleY(.78)}}
.bat.flip .inner{animation-name:flapF}@keyframes flapF{from{transform:scaleX(-1) scaleY(1)}to{transform:scaleX(-1) scaleY(.78)}}
.waver .inner{animation:wave 1.1s ease-in-out infinite;transform-origin:50% 85%}
@keyframes wave{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-8px)}}

/* CSS fallback shapes (used until/unless an image loads) */
.sg{position:absolute;inset:10% 14% 6%;border-radius:50% 50% 38% 38%/62% 62% 38% 38%;
  background:radial-gradient(circle at 36% 28%,#fff 0 30%,#e9eeff 55%,#c4cff5);box-shadow:inset -6px -8px 0 rgba(150,160,230,.35)}
.sg::after{content:"";position:absolute;left:8%;right:8%;bottom:-8%;height:22%;
  background:radial-gradient(circle at 16% 0,#d6ddfa 0 38%,transparent 40%),radial-gradient(circle at 50% 0,#d6ddfa 0 38%,transparent 40%),radial-gradient(circle at 84% 0,#d6ddfa 0 38%,transparent 40%)}
.sg i{position:absolute;top:36%;width:15%;height:19%;background:#1d2647;border-radius:50%;transition:transform .15s}
.sg i:first-child{left:26%}.sg i:last-child{right:26%}
.sg b{position:absolute;left:44%;top:60%;width:12%;height:6%;border-radius:0 0 10px 10px;background:#1d2647}
.lit .sg i{transform:scale(1.45)}
.sg.gold{background:radial-gradient(circle at 36% 28%,#fff6c8 0 22%,#ffd34d 55%,#e59b12)}
.sg.gold::after{background:radial-gradient(circle at 16% 0,#f4b42a 0 38%,transparent 40%),radial-gradient(circle at 50% 0,#f4b42a 0 38%,transparent 40%),radial-gradient(circle at 84% 0,#f4b42a 0 38%,transparent 40%)}
.sg.hat::before{content:"";position:absolute;left:30%;top:-26%;width:40%;height:34%;background:#4a2a7a;clip-path:polygon(50% 0,100% 100%,0 100%)}
.sg.pumpkin::before{content:"";position:absolute;left:28%;top:-16%;width:44%;height:26%;border-radius:50%;background:#f08a24;box-shadow:inset 0 -4px 0 #c96510}
.sb{position:absolute;inset:26% 6%}
.sb::before{content:"";position:absolute;inset:0;background:#5b3a8e;clip-path:polygon(0 20%,22% 40%,36% 30%,42% 45%,50% 38%,58% 45%,64% 30%,78% 40%,100% 20%,88% 70%,70% 60%,58% 85%,50% 75%,42% 85%,30% 60%,12% 70%)}
.sb::after{content:"";position:absolute;left:41%;top:40%;width:6%;height:9%;background:#ffd36b;border-radius:50%;box-shadow:9px 0 0 #ffd36b}
.sc{display:inline-block;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc93c 45%,#d98a10);box-shadow:inset 0 0 0 3px #b8740c}

/* ---------- layers ---------- */
#darkCv{pointer-events:none}
#flashW{background:#e8f0ff;opacity:0;pointer-events:none;mix-blend-mode:screen}
#flashR{background:radial-gradient(circle,rgba(255,60,90,.0) 30%,rgba(255,40,80,.55));opacity:0;pointer-events:none;transition:opacity .35s}
#fxCv{pointer-events:none}
#fxDom{pointer-events:none;overflow:hidden}
#stage{touch-action:none}
.pop{position:absolute;font-weight:700;font-size:22px;color:var(--candle);white-space:nowrap;transform:translate(-50%,-50%);
  text-shadow:0 2px 0 #5a2c00,0 0 12px rgba(255,180,60,.9);animation:pop 1s ease-out forwards}
.pop.big{font-size:26px;color:#fff3b0}
.pop.bad{color:#ffb3bd;text-shadow:0 2px 0 #5a0012,0 0 12px rgba(255,60,90,.9)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.rain{position:absolute;top:-60px;width:40px;height:40px;animation:fall linear forwards}
.rain img,.rain .sc{width:100%;height:100%}
@keyframes fall{to{transform:translateY(calc(100vh + 120px)) rotate(var(--rot))}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px);
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;opacity:0;transform:translateY(-20px);transition:.35s}
#hud.show{opacity:1;transform:none}
.panel{background:var(--panel);border:2px solid rgba(255,207,90,.85);border-radius:16px;
  box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12),0 0 18px rgba(130,70,220,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#money{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px}
#money .ico{width:34px;height:34px;flex:none;position:relative}
#money .ico img,#money .ico .sc{position:absolute;inset:0;width:100%;height:100%}
#moneyTxt{font-weight:700;font-size:18px;line-height:1;letter-spacing:.2px}
#moneyTxt .cur{color:var(--gold);display:inline-block}
#moneyTxt .max{color:rgba(255,255,255,.6);font-size:14px}
#found{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:3px;font-weight:500}
.bump{animation:bump .45s cubic-bezier(.3,1.9,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35) translateY(-2px)}100%{transform:scale(1)}}
#right{display:flex;gap:8px;align-items:flex-start;pointer-events:auto}
#timer{min-width:76px;padding:8px 12px;text-align:center;font-weight:700;font-size:22px;line-height:1}
#timer small{display:block;font-size:10px;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,.6);margin-bottom:2px}
#timer.low{border-color:var(--red);color:#ff8090;animation:blink .5s steps(2,start) infinite}
#timer.low small{color:#ff8090}
@keyframes blink{50%{opacity:.35}}
#muteBtn{position:absolute;z-index:5;right:calc(var(--sar) + 12px);top:calc(var(--sat) + 74px);width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:14px;transition:top .35s}
#muteBtn.atTop{top:calc(var(--sat) + 10px)}
#muteBtn svg{width:22px;height:22px}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 20px) calc(var(--sar) + 18px) calc(var(--sab) + 20px) calc(var(--sal) + 18px);
  opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.show{opacity:1;pointer-events:auto}
#menu{justify-content:space-between}
.titleWrap{position:relative;width:min(100%,400px);aspect-ratio:707/285;margin-top:max(48px,5vh);animation:float 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.titleWrap img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .4s}
.titleWrap img.ok{opacity:1}
.titleWrap .plank{position:absolute;inset:16% 8% 14%;border-radius:14px;background:repeating-linear-gradient(180deg,#3c3360 0 30%,#2f2850 30% 33%);box-shadow:0 6px 0 #1c1535,inset 0 0 0 3px #1c1535}
.titleWrap img.ok + .plank{display:none}
.titleText{position:absolute;left:0;right:0;top:50%;transform:translateY(-44%);text-align:center;
  font-family:"Creepster","Chalkduster","Trebuchet MS",cursive;font-size:clamp(44px,15vw,66px);letter-spacing:2px;color:var(--gold);line-height:1;
  text-shadow:0 3px 0 #6b3a00,0 6px 0 #2a1600,0 0 18px rgba(255,190,60,.65)}
.card{width:min(100%,360px);padding:18px 18px 20px;text-align:center}
.card p{margin:0 0 14px;font-size:17px;line-height:1.35;font-weight:500}
.legend{display:flex;justify-content:center;gap:10px;margin:0 0 18px}
.legend div{flex:1;background:rgba(0,0,0,.22);border-radius:12px;padding:8px 4px 7px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.88)}
.legend .li{width:40px;height:40px;margin:0 auto 4px;position:relative}
.legend .li img,.legend .li > span{position:absolute;inset:0;width:100%;height:100%}
.legend b{display:block;color:var(--gold);font-size:13.5px}
.legend .neg b{color:#ff9aa6}

.btn{appearance:none;border:0;font-family:inherit;font-weight:700;cursor:pointer;color:#2a1400;
  background:linear-gradient(180deg,#ffe28a,#ffbd3a 55%,#f09a1a);border-radius:18px;padding:14px 26px;font-size:22px;letter-spacing:1.5px;
  box-shadow:0 5px 0 #a35a08,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6);transition:transform .08s;touch-action:manipulation}
.btn.pressed{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 #a35a08,0 3px 8px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.boing{animation:boing .38s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{transform:scale(.92)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.btn.ghosty{background:rgba(60,30,100,.8);color:#fff;border:2px solid rgba(255,207,90,.8);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn.ghosty.pressed{box-shadow:0 0 0 rgba(0,0,0,.4)}
#startBtn{width:100%;font-size:26px;padding:16px}

#result .card{padding:22px 18px 20px;animation:none}
#result.show .card{animation:cardIn .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes cardIn{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
#resHead{font-family:"Creepster","Chalkduster","Trebuchet MS",cursive;font-size:36px;letter-spacing:2px;color:var(--gold);text-shadow:0 3px 0 #5a2c00,0 0 14px rgba(255,180,60,.6);margin:0 0 4px}
#resWon{font-size:26px;font-weight:700;margin:4px 0 2px}
#resWon span{color:var(--gold)}
#resSub{font-size:14px;color:rgba(255,255,255,.7);margin:0 0 16px}
#codeBox{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:2px dashed rgba(255,207,90,.7);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:16px}
#codeBox .lbl{font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.55);text-align:left}
#codeTxt{font-size:21px;font-weight:700;letter-spacing:1.5px;text-align:left;-webkit-user-select:all;user-select:all;color:#fff}
#copyBtn{margin-left:auto;font-size:15px;padding:10px 14px;border-radius:12px;letter-spacing:1px;min-width:86px}
#claimBtn{display:block;width:100%;font-size:28px;padding:18px;border-radius:22px;letter-spacing:2px;margin-bottom:12px;
  background:linear-gradient(180deg,#fff2b8,#ffd04a 45%,#f5a516 75%,#e08a0c);
  animation:pulse 1.6s ease-in-out infinite}
#claimBtn.pressed{animation:none}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #a35a08,0 0 0 0 rgba(255,210,80,.65),0 0 22px rgba(255,190,60,.55),inset 0 2px 0 rgba(255,255,255,.7);transform:scale(1)}
  50%{box-shadow:0 5px 0 #a35a08,0 0 0 12px rgba(255,210,80,0),0 0 36px rgba(255,200,70,.9),inset 0 2px 0 rgba(255,255,255,.7);transform:scale(1.035)}}
#againBtn{width:100%;font-size:18px;padding:12px}
.hidden{display:none!important}
a.btn{text-decoration:none;text-align:center}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.titleWrap,.web,.drape,#spider,#claimBtn,.waver .inner{animation:none!important}}
</style>

  const r = game.getBoundingClientRect();

  for (const c of [darkCv, fxCv]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); c.style.width = W + "px"; c.style.height = H + "px"; }
  const s = Math.max(W / 720, H / 1280);

}

    master = AC.createGain(); master.gain.value = muted ? 0 : CONFIG.VOLUME; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);

  [76,1],[81,.5],[83,.5],[84,1],   [83,.5],[81,.5],[77,1],[74,1],
  [76,1],[80,.5],[81,.5],[83,1],   [84,1.5],[83,.5],[81,1],

  [76,.5],[77,.5],[80,.5],[83,.5],[86,1], [84,.5],[83,.5],[81,2]

  [45,60,64],[50,62,65],[40,56,59],[45,60,64],[41,57,60],[50,62,65],[40,56,62],[45,60,64]

/* ---------------- loop ---------------- */

}

  } else if (state === "menu") light.r = CONFIG.LIGHT_RADIUS_START * S * 1.05;

        Math.hypot(e.x - light.x, e.y - light.y) < light.r * CONFIG.CATCH_REACH + e.size * 0.2;

  if (entities.length > 40 || (entities.length && Math.random() < 0.05)) entities = entities.filter(e => e.state !== "dead");

  drawDark();
  drawFx(dt);
}
function lightning(quiet) {
  nextLightningAt = now + rand(CONFIG.LIGHTNING_MIN, CONFIG.LIGHTNING_MAX);
  lightningHideUntil = now + 0.32;
  flash = 1;
  setTimeout(() => { flash = Math.max(flash, 0.7); }, 110);
  if (!quiet || AC) setTimeout(SFX.thunder, 380);
}

/* ---------------- input ---------------- */
const pointers = new Map();
const TAP_SLOP = 14, TAP_MS = 450;
function localXY(e) { const r = game.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
// Drag anywhere on the screen: the flashlight moves by the finger's movement (like a trackpad),
// so the finger never has to sit on the light and never covers it.
stage.addEventListener("pointerdown", e => {
  e.preventDefault();
  const [x, y] = localXY(e);
  const primary = ![...pointers.values()].some(p => p.primary);
  pointers.set(e.pointerId, { x0: x, y0: y, lx: x, ly: y, t0: performance.now(), moved: 0, primary });
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener("pointermove", e => {
  const [x, y] = localXY(e);
  const p = pointers.get(e.pointerId);
  if (p) {
    p.moved = Math.max(p.moved, Math.hypot(x - p.x0, y - p.y0));
    if (p.primary && state === "playing") {
      light.tx = clamp(light.tx + (x - p.lx) * CONFIG.DRAG_SPEED, 0, W);
      light.ty = clamp(light.ty + (y - p.ly) * CONFIG.DRAG_SPEED, playTop - 60, H);
    }
    p.lx = x; p.ly = y;
  } else if (e.pointerType === "mouse" && state === "playing") { light.tx = x; light.ty = y; } // desktop hover: light follows the mouse
});
function endPointer(e, cancel) {
  const p = pointers.get(e.pointerId); if (!p) return;
  pointers.delete(e.pointerId);
  if (cancel) return;
  const [x, y] = localXY(e);
  // catching is done by light, so a tap only moves the flashlight
}
stage.addEventListener("pointerup", e => endPointer(e, false));
stage.addEventListener("pointercancel", e => endPointer(e, true));

function catchGhost(e) {
  killEnt(e, "caught");
  const gold = e.type === "gold";
  const gain = gold ? GOLD_CENTS : PER_CENTS;
  cents = Math.min(MAX_CENTS, cents + gain); found++;
  sparkle(e.x, e.y, gold ? 34 : 18, gold ? ["#ffe27a", "#ffc93c", "#fff6d0"] : ["#fff6c8", "#9ff3ea", "#ffd36b", "#e7d2ff"]);
  popText(e.x, e.y - e.size * 0.45, gold ? "LUCKY! +" + rm(gain) : "+" + rm(gain), gold ? "big" : "");
  gold ? SFX.gold() : SFX.ding();
  updateHud(true);
  nextGhostAt = Math.min(nextGhostAt, now + CONFIG.RESPAWN_DELAY_MIN);
  if (cents >= MAX_CENTS) endRound(true);
}
function hitBat(e) {
  e.state = "dead"; e.el.style.transition = "opacity .25s"; e.el.classList.remove("on");
  setTimeout(() => e.el.remove(), 300);
  penalty += CONFIG.BAT_PENALTY;
  SFX.squeak();
  sparkle(e.x, e.y, 12, ["#b48cff", "#ff8fa3"]);
  popText(e.x, e.y - e.size * 0.4, "−" + CONFIG.BAT_PENALTY + "s", "bad");
  const fr = $("#flashR"); fr.style.transition = "none"; fr.style.opacity = "1";
  requestAnimationFrame(() => { fr.style.transition = "opacity .45s"; fr.style.opacity = "0"; });
  bump($("#timer"));
  if (navigator.vibrate) try { navigator.vibrate(40); } catch (_) {}
}
function updateHud(anim) {
  $("#moneyCur").textContent = rm(cents);
  $("#foundN").textContent = found;
  if (anim) { bump($("#moneyCur")); bump($("#money .ico")); }
}

/* ---------------- flow ---------------- */
function startRound() {
  initAudio(); startAmbient();
  clearEnts(); particles = [];
  state = "playing"; elapsed = 0; penalty = 0; cents = 0; found = 0; lastShownSec = -1; claimed = false;
  darkTarget = 0.985; nextGhostAt = now + 0.25; nextLightningAt = now + rand(4, 7);
  light.tx = W / 2; light.ty = H * 0.55;
  $("#timer").classList.remove("low");
  updateHud(false);
  $("#menu").classList.remove("show"); $("#result").classList.remove("show"); $("#hud").classList.add("show"); $("#muteBtn").classList.remove("atTop");
  spawnGhost(0); spawnGhost(0);
}
function endRound(won) {
  if (state !== "playing") return;
  state = "ending";
  pointers.clear();
  musicRate = 1;
  $("#timer").classList.remove("low");
  if (won) {
    entities.forEach(e => killEnt(e)); entities = entities.filter(e => e.state !== "dead");
    darkTarget = 0;
    SFX.win(); coinRain();
    const kinds = ["ghost_1", "ghost_2", "ghost_gold", "ghost_3", "ghost_1"];
    kinds.forEach((k, i) => setTimeout(() => {
      const e = makeEnt(k === "ghost_gold" ? "gold" : "ghost", k);
      e.size = CONFIG.GHOST_SIZE * S * (k === "ghost_gold" ? 1.15 : 0.95);
      const ang = Math.PI * (0.15 + 0.7 * (i / (kinds.length - 1)));
      e.x = e.bx = W / 2 - Math.cos(ang) * W * 0.36; e.y = e.by = H * 0.5 - Math.sin(ang) * H * 0.12;
      e.age = 0; e.life = 1e9; e.floats = false; e.phase = i; e.state = "live"; e.lit = false; e.demo = true;
      e.el.style.width = e.el.style.height = e.size + "px"; e.el.classList.add("waver");
      e.inner.style.animationDelay = (-i * 0.2) + "s";
      placeEnt(e); entities.push(e); requestAnimationFrame(() => e.el.classList.add("on"));
      sparkle(e.x, e.y, 10, ["#fff6c8", "#ffd36b"]);
    }, 250 + i * 160));
    setTimeout(() => showResult(true), 2700);
  } else {
    SFX.timeUp();
    entities.forEach(e => killEnt(e)); entities = [];
    darkTarget = 0.7;
    setTimeout(() => showResult(false), 900);
  }
}
function makeCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", buf = new Uint32Array(6);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  let s = ""; for (let i = 0; i < 6; i++) s += A[buf[i] % A.length];
  return "GHOST-" + s;
}
function showResult(won) {
  state = "over";
  voucher = cents > 0 ? makeCode() : "";
  $("#resHead").textContent = won ? "Perfect Hunt!" : "Time's Up!";
  $("#resWon").innerHTML = cents > 0 ? `You won <span id="resAmt">${rm(cents)}</span>!` : "No ghosts caught!";
  $("#resSub").textContent = cents > 0 ? `You found ${found} ghost${found === 1 ? "" : "s"}` : "Sweep the light slowly and tap them fast.";
  $("#claimArea").classList.toggle("hidden", cents <= 0);
  $("#codeTxt").textContent = voucher;
  $("#copyBtn").textContent = "COPY";
  $("#claimBtn").textContent = "CLAIM NOW";
  const cb = $("#claimBtn"), amt = (cents / 100).toFixed(2);
  cb.href = claimUrl(amt, voucher);
  if (CLAIM_OPEN_NEW_TAB) cb.target = "_blank"; else cb.removeAttribute("target");
  $("#hud").classList.remove("show"); $("#muteBtn").classList.add("atTop");
  $("#result").classList.add("show");
  fitResult();
  if (cents > 0) MGS.win({ amount: cents / 100, code: voucher, label: rm(cents) }); else MGS.gameOver();
}
function fitResult(){ const el = $("#result .card"); el.style.transform = ""; const k = Math.min(1, (innerHeight - 48) / el.offsetHeight, (innerWidth - 24) / el.offsetWidth); if (k < 1) { el.style.transformOrigin = "50% 50%"; el.style.transform = "scale(" + k.toFixed(3) + ")"; } }
window.addEventListener("resize", () => { if ($("#result").classList.contains("show")) fitResult(); });

/* ---------------- buttons ---------------- */
document.querySelectorAll(".btn").forEach(b => {
  b.addEventListener("pointerdown", () => { b.classList.remove("boing"); b.classList.add("pressed"); });
  const up = () => { if (!b.classList.contains("pressed")) return; b.classList.remove("pressed"); void b.offsetWidth; b.classList.add("boing"); };
  b.addEventListener("pointerup", up); b.addEventListener("pointerleave", up); b.addEventListener("pointercancel", up);
  b.addEventListener("animationend", ev => { if (ev.animationName === "boing") b.classList.remove("boing"); });
});
$("#startBtn").addEventListener("click", startRound);
$("#againBtn").addEventListener("click", MGS.paid(startRound));
$("#muteBtn").addEventListener("click", () => { initAudio(); if (state !== "menu") startAmbient(); setMuted(!muted); });
$("#copyBtn").addEventListener("click", () => {
  const done = () => { $("#copyBtn").textContent = "COPIED!"; setTimeout(() => { $("#copyBtn").textContent = "COPY"; }, 1600); };
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = voucher; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;"; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, 99); try { document.execCommand("copy"); } catch (_) {} ta.remove(); done();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(voucher).then(done, fallback); else fallback();
});
function claimUrl(amount, code) {
  if (!CLAIM_URL) return "#";
  try { const u = new URL(CLAIM_URL, location.href); u.searchParams.set("amount", amount); u.searchParams.set("code", code); return u.toString(); }
  catch (_) { return CLAIM_URL + (CLAIM_URL.includes("?") ? "&" : "?") + "amount=" + amount + "&code=" + encodeURIComponent(code); }
}
$("#claimBtn").addEventListener("click", ev => {
  if (claimed || cents <= 0 || !CLAIM_URL) { ev.preventDefault(); return; }
  claimed = true;
  try { onClaim((cents / 100).toFixed(2), voucher); } catch (err) { console.error(err); }
  // the link itself opens CLAIM_URL (same tab, or new tab when CLAIM_OPEN_NEW_TAB is true)
  setTimeout(() => { claimed = false; }, 1500);
});

/* ---------------- iOS guards ---------------- */
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => { if (!e.target.closest || !e.target.closest("#codeTxt")) e.preventDefault(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { paused = true; if (AC) AC.suspend(); }
  else { paused = false; lastTs = 0; if (AC) AC.resume(); }
});
window.addEventListener("pageshow", e => { if (e.persisted) { claimed = false; $("#claimBtn").textContent = "CLAIM NOW"; } });
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 250));

/* ---------------- boot ---------------- */
setMuted(muted);
$("#moneyMax").textContent = "/ " + rm(MAX_CENTS);
$("#timeTxt").textContent = CONFIG.GAME_TIME;
resize();
nextLightningAt = 3;
// two shy demo ghosts on the start screen for the wandering light to discover
setTimeout(() => { if (state === "menu") { spawnGhost(0, true); spawnGhost(0, true); } }, 400);
requestAnimationFrame(loop);
/* MGS: skip in-game start screen */
MGS.onAudioUnlock(initAudio);
MGS.boot(startRound);
window.MGS_TEST = { startRound, endRound, showResult, catchGhost, get state(){ return state; }, get cents(){ return cents; }, set cents(v){ cents = v; updateHud(false); }, get elapsed(){ return elapsed; }, set elapsed(v){ elapsed = v; }, get entities(){ return entities; }, light };
})();
</script>
