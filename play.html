<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Play · Mini Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7">
<style>
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .topbar-in{max-width:none}
  .left{display:flex;align-items:center;gap:10px;min-width:0}
  .icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:#d7d9e8}
  .icon-btn:hover{background:rgba(255,255,255,.12);color:#fff}
  .icon-btn svg{width:18px;height:18px}
  .gtitle{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right{display:flex;align-items:center;gap:8px}

  .stage{position:relative;flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden}
  .stage-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.35) saturate(1.2);transform:scale(1.1)}
  .frame-wrap{position:relative;width:100%;height:100%}
  @media(min-width:700px){
    .frame-wrap{width:min(480px,100%);margin:14px 0;height:calc(100% - 28px);border-radius:20px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
  }
  iframe{display:none;width:100%;height:100%;border:0;background:#000}

  .gate{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
  .gate-card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(23,26,40,.92),rgba(14,16,26,.96));border:1px solid var(--line-2);border-radius:22px;overflow:hidden;backdrop-filter:blur(10px);box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
  .gate-thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--card-2)}
  .gate-thumb img,.gate-thumb .ph{width:100%;height:100%;object-fit:cover}
  .gate-thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(transparent,#151827)}
  .gate-body{padding:0 18px 18px;margin-top:-28px;position:relative;z-index:1}
  .gate-body h1{font-size:24px;font-weight:800}
  .gate-stats{display:flex;gap:10px;margin-top:12px}
  .stat{flex:1;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .stat small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .stat b{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
  .gate .howto{padding:12px 0 2px}
  .gate .btn{width:100%;margin-top:14px;height:52px;font-size:16px}
  .gate .err{color:#ff8ea1;font-size:13px;text-align:center;margin-top:10px;min-height:1em}
  iframe.on{display:block}
  .replay-q{padding:18px 18px 4px;font-size:16px;line-height:1.5;color:#d7d9e8}
  @media(max-width:420px){.gtitle{font-size:15px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="left">
      <a class="icon-btn" id="back" href="index.html" aria-label="Back to games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span class="gtitle" id="gtitle">Loading…</span>
    </div>
    <div class="right">
      <button class="icon-btn" id="infoBtn" aria-label="How to play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn hidden" id="againBtn" aria-label="Play again">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <div class="token-pill" id="tokenPill">
        <span class="coin">T</span>
        <span class="token-text"><b id="tokenNum">…</b><span>TOKEN</span></span>
      </div>
    </div>
  </div>
  <div id="vbar"></div>
</header>

<main class="stage">
  <div class="stage-bg" id="stageBg"></div>
  <div class="frame-wrap"><iframe id="frame" title="Game" allow="autoplay; fullscreen; clipboard-write" allowfullscreen></iframe></div>

  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-thumb" id="gateThumb"></div>
      <div class="gate-body">
        <h1 id="gateTitle"></h1>
        <div class="gate-stats">
          <div class="stat"><small>COST</small><b><span class="coin sm">T</span><span id="gateCost"></span></b></div>
          <div class="stat"><small>YOUR BALANCE</small><b><span class="coin sm">T</span><span id="gateBal">…</span></b></div>
        </div>
        <ul class="howto" id="gateHow"></ul>
        <button class="btn btn-gold" id="startBtn">Start</button>
        <div class="err" id="gateErr"></div>
      </div>
    </div>
  </div>
</main>

<script src="games.config.js?v=7"></script>
<script src="assets/token.js?v=7"></script>
<script src="assets/voucher.js?v=7"></script>
<script src="assets/common.js?v=7"></script>
<script>
(function () {
  const { esc, ICON, thumbImg, openModal, closeModal, toast } = UI;
  const qs = new URLSearchParams(location.search);
  const id = qs.get("game");
  const g = (window.GAMES || []).find((x) => x.id === id);

  // 返回大厅时保留 ?token=
  const backQs = new URLSearchParams(qs); backQs.delete("game");
  document.getElementById("back").href = "index.html" + (backQs.toString() ? "?" + backQs : "");

  const $ = (i) => document.getElementById(i);
  const frame = $("frame"), gate = $("gate"), startBtn = $("startBtn"), err = $("gateErr");
  let balance = 0;

  if (!g) {
    $("gtitle").textContent = "Game not found";
    $("gateTitle").textContent = "Game not found";
    $("gateThumb").classList.add("hidden");
    document.querySelector(".gate-stats").classList.add("hidden");
    startBtn.textContent = "Back to games";
    startBtn.onclick = () => (location.href = $("back").href);
    UI.bindTokenPill();
    $("infoBtn").classList.add("hidden");
    return;
  }

  document.title = g.title + " · Mini Games";
  $("gtitle").textContent = g.title;
  if (g.thumb) $("stageBg").style.backgroundImage = `url("${g.thumb}")`;
  $("gateThumb").innerHTML = thumbImg(g);
  $("gateTitle").textContent = g.title;
  $("gateCost").textContent = g.cost;
  $("gateHow").innerHTML = (g.howTo || []).map((s) => `<li>${esc(s)}</li>`).join("");

  // 已付费的这一局（防止刷新页面重复扣 TOKEN）
  let playing = false;                       // 已付费、游戏还没结束
  const TICKET = "mgs.ticket." + g.id;
  const hasTicket = () => { try { return !!sessionStorage.getItem(TICKET); } catch (e) { return false; } };
  const setTicket = (v) => { try { v ? sessionStorage.setItem(TICKET, String(Date.now())) : sessionStorage.removeItem(TICKET); } catch (e) {} };

  function updateGate() {
    $("gateBal").textContent = balance.toLocaleString();
    const enough = balance >= g.cost;
    startBtn.disabled = false;
    startBtn.innerHTML = enough
      ? `${ICON.play.replace("<svg", '<svg width="18" height="18"')} Start · use ${g.cost} TOKEN`
      : "Not enough TOKEN";
    if (!enough) startBtn.disabled = true;
  }
  TokenService.onChange((b) => { balance = b; updateGate(); });
  UI.bindTokenPill();

  function launch() {
    gate.classList.add("hidden");
    $("againBtn").classList.remove("hidden");
    frame.src = g.file + (g.file.includes("?") ? "&" : "?") + "v=7";
    frame.classList.add("on");
    playing = true;
  }

  async function pay() {
    err.textContent = "";
    startBtn.disabled = true;
    startBtn.textContent = "Starting…";
    try {
      await TokenService.spend(g.id, g.cost);
      setTicket(true);
      UI.notify({ kind: "spend", title: `−${g.cost} TOKEN`, sub: `Balance: ${balance.toLocaleString()} TOKEN · Good luck!` });
      launch();
    } catch (e) {
      gate.classList.remove("hidden");
      err.textContent = e.message === "INSUFFICIENT" ? "Not enough TOKEN." : "Could not start the game. Please try again.";
      updateGate();
    }
  }
  startBtn.onclick = pay;

  /* ---------- 游戏中途离开：提醒 TOKEN 不退还 ---------- */
  const inProgress = () => playing;
  const WARN_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".5" fill="currentColor"/></svg>';
  const lostNote = () => `<div class="leave-q"><span class="lq-ico">${WARN_ICO}</span>
    <p>This game isn't finished yet. If you leave now, the <b class="gold">${g.cost} TOKEN</b> you used <b>will not be returned</b>.</p></div>`;

  $("back").addEventListener("click", (e) => {
    if (!inProgress()) return;
    e.preventDefault();
    openModal(g, {
      subtitle: "Game in progress",
      body: lostNote(),
      actions: [
        { label: "Leave anyway", cls: "btn-danger", onClick: () => { setTicket(false); playing = false; closeModal(); location.href = $("back").href; } },
        { label: "Keep playing", cls: "btn-gold", onClick: closeModal }
      ]
    });
  });
  // 浏览器返回键 / 关闭分页时也提醒
  window.addEventListener("beforeunload", (e) => {
    if (!inProgress()) return;
    e.preventDefault(); e.returnValue = "";
  });

  // 重玩：再扣一次 TOKEN
  $("againBtn").onclick = () => {
    openModal(g, {
      subtitle: `Play again for <span class="coin sm">T</span> ${g.cost} TOKEN?`,
      body: inProgress() ? lostNote().replace("If you leave now", "If you restart now") : "",
      actions: [
        { label: "Cancel", onClick: closeModal },
        { label: `Play again · ${g.cost}`, cls: "btn-gold", disabled: balance < g.cost,
          onClick: async () => { closeModal(); frame.src = "about:blank"; setTicket(false); await pay(); } }
      ]
    });
  };

  $("infoBtn").onclick = () => openModal(g, { actions: [{ label: "Got it", cls: "btn-gold", onClick: closeModal }] });

  /* ---------- 游戏通知（mgs-bridge.js） ---------- */
  UI.mountVoucherBar(document.getElementById("vbar"), { hideEmpty: true });
  const toGame = (msg) => { try { frame.contentWindow.postMessage(Object.assign({ mgs: 1 }, msg), "*"); } catch (e) {} };

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.mgs !== 1 || e.source !== frame.contentWindow) return;

    if (d.type === "win") {
      VoucherService.add({ gameId: g.id, gameTitle: g.title, amount: d.amount, code: d.code, label: d.label });
      setTicket(false); playing = false;      // 这一局结束
      UI.notify({ kind: "win", title: `You won ${d.label || VoucherService.fmt(d.amount)}!`, sub: "Voucher saved to My Vouchers" });
    }

    if (d.type === "over") { setTicket(false); playing = false; }  // 输了，这一局结束

    if (d.type === "replay-request") {        // 输了按 Replay → 先扣 TOKEN
      const enough = balance >= g.cost;
      openModal(g, {
        subtitle: `Your balance: <span class="coin sm">T</span> ${balance.toLocaleString()} TOKEN`,
        body: `<p class="replay-q">${enough
          ? `Play again for <b class="gold">${g.cost} TOKEN</b>?`
          : `You need <b class="gold">${g.cost} TOKEN</b> to play again.`}</p>`,
        actions: [
          { label: enough ? "Cancel" : "Back to games", onClick: () => { if (enough) closeModal(); else location.href = $("back").href; } },
          { label: `Play again · ${g.cost}`, cls: "btn-gold", disabled: !enough, onClick: async () => {
              closeModal();
              try {
                await TokenService.spend(g.id, g.cost);
                setTicket(true); playing = true;
                UI.notify({ kind: "spend", title: `−${g.cost} TOKEN`, sub: `Balance: ${balance.toLocaleString()} TOKEN · Good luck!` });
                toGame({ type: "replay-ok", id: d.id });
              } catch (err) { toast(err.message === "INSUFFICIENT" ? "Not enough TOKEN." : "Could not start. Try again."); }
            } }
        ]
      });
    }
  });

  if (hasTicket()) launch();
})();
</script>
</body>
</html>
