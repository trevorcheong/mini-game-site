<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Play · Mini Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=28">
<style>
  html,body{height:100%;overflow:hidden}
  @supports (height:100dvh){html,body{height:100dvh}}
  html.app-h,html.app-h body{height:var(--app-h)}
  /* 关键：取消共用样式里的 min-height:100vh（iPhone 上会按整个屏幕算，把页面撑高） */
  html,body{min-height:0!important}
  body{box-sizing:border-box}
  /* innerHeight 已经扣掉 Safari 工具栏，只留一点 iPhone 底部安全区 */
  @media(max-width:699px){html.ios-safari body{padding-bottom:6px}}
  body{display:flex;flex-direction:column}
  .topbar-in{max-width:none}
  .left{display:flex;align-items:center;gap:10px;min-width:0}
  .icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:#d7d9e8}
  .icon-btn:hover{background:rgba(255,255,255,.12);color:#fff}
  .icon-btn svg{width:18px;height:18px}
  .gtitle{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .right{display:flex;align-items:center;gap:8px}

  .stage{position:relative;flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden}
  .stage-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.35) saturate(1.2);transform:scale(1.1)}
  .frame-wrap{position:relative;width:100%;height:100%}
  @media(min-width:700px){
    .frame-wrap{width:min(480px,100%);margin:14px 0;height:calc(100% - 28px);border-radius:20px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
  }
  iframe{display:block;visibility:hidden;width:100%;height:100%;border:0;background:#000}

  .gate{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 16px;overflow:hidden}
  /* 手机：留出 Safari / Chrome 底部浮动工具栏的空间 */
  .gate-card{display:flex;flex-direction:column;max-height:100%;min-height:0}
  .gate-card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(23,26,40,.92),rgba(14,16,26,.96));border:1px solid var(--line-2);border-radius:22px;overflow:hidden;backdrop-filter:blur(10px);box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
  .gate-thumb{position:relative;flex:0 1 auto;aspect-ratio:16/8;min-height:64px;max-height:28%;width:100%;overflow:hidden;background:var(--card-2)}
  .gate-thumb img,.gate-thumb .ph{width:100%;height:100%;object-fit:cover}
  .gate-thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(transparent,#151827)}
  .gate-body{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;padding:0 18px 16px;margin-top:-28px;position:relative;z-index:1}
  .gate-body > *{flex:none}
  .gate-body h1{font-size:24px;font-weight:800}
  .gate-stats{display:flex;gap:10px;margin-top:12px}
  .stat{flex:1;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .stat small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .stat b{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
  .gate .howto{padding:4px 0 0;flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .how-label{margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
  .gate .btn{width:100%;margin-top:12px;height:54px;font-size:17px}
  .gate .err{color:#ff8ea1;font-size:13px;text-align:center;margin-top:8px}
  .gate .err:empty{display:none}
  @media (max-height:700px){.gate-body h1{font-size:21px}.gate .howto li{padding:7px 0;font-size:13px}.stat{padding:8px 12px}}
  @media (max-height:560px){.gate-body h1{font-size:18px}.gate .btn{height:48px}.how-label{margin-top:10px}}
  iframe.on{visibility:visible}
  .frame-wrap:has(iframe:not(.on)){border-color:transparent;box-shadow:none}
  .replay-q{padding:18px 18px 4px;font-size:16px;line-height:1.5;color:#d7d9e8}
  @media(max-width:420px){.gtitle{font-size:15px}}
  @media(max-width:560px){.player-chip .p-txt{display:none}.player-chip{padding:4px}.right{gap:6px}}
  /* iPhone Safari：底部工具栏浮在网页上，游戏画面要留空间 */
  </style>
<script>
  (function () {
    var ua = navigator.userAgent;
    var iOS = /iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
    if (iOS) document.documentElement.classList.add("ios-safari");

    // 用手机实际看得到的高度来排版（避免网页比屏幕高、底部被切掉）
    var root = document.documentElement;
    function fit() {
      var h = window.innerHeight;
      if (window.visualViewport && window.visualViewport.scale <= 1.01) h = Math.min(h, Math.round(window.visualViewport.height));
      root.style.setProperty("--app-h", h + "px");
      root.classList.add("app-h");
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="left">
      <a class="icon-btn" id="back" href="index.html" aria-label="Back to games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span class="gtitle" id="gtitle">Loading…</span>
    </div>
    <div class="right">
      <button class="icon-btn" id="infoBtn" aria-label="How to play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn hidden" id="againBtn" aria-label="Play again">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <div class="token-pill" id="tokenPill">
        <span class="coin">T</span>
        <span class="token-text"><b id="tokenNum">…</b><span>TOKEN</span></span>
      </div>
    </div>
  </div>
  <div id="vbar"></div>
</header>

<main class="stage">
  <div class="stage-bg" id="stageBg"></div>
  <div class="frame-wrap"><iframe id="frame" title="Game" allow="autoplay; fullscreen; clipboard-write" allowfullscreen></iframe></div>

  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-thumb" id="gateThumb"></div>
      <div class="gate-body">
        <h1 id="gateTitle"></h1>
        <div class="gate-stats">
          <div class="stat"><small>COST</small><b><span class="coin sm">T</span><span id="gateCost"></span></b></div>
          <div class="stat"><small>YOUR BALANCE</small><b><span class="coin sm">T</span><span id="gateBal">…</span></b></div>
        </div>
        <button class="btn btn-gold" id="startBtn">Start</button>
        <div class="err" id="gateErr"></div>
        <div class="how-label">HOW TO PLAY</div>
        <ul class="howto" id="gateHow"></ul>
      </div>
    </div>
  </div>
</main>

<script src="games.config.js?v=28"></script>
<script src="assets/token.js?v=28"></script>
<script src="assets/voucher.js?v=28"></script>
<script src="assets/common.js?v=28"></script>
<script>
(function () {
  const { esc, ICON, thumbImg, openModal, closeModal, toast } = UI;
  const qs = new URLSearchParams(location.search);
  const id = qs.get("game");
  const g = (window.GAMES || []).find((x) => x.id === id);

  // 返回大厅时保留 ?token=
  const backQs = new URLSearchParams(qs); backQs.delete("game"); backQs.delete("v");
  document.getElementById("back").href = "index.html" + (backQs.toString() ? "?" + backQs : "");

  const $ = (i) => document.getElementById(i);
  const frame = $("frame"), gate = $("gate"), startBtn = $("startBtn"), err = $("gateErr");
  let balance = 0;

  if (!g) {
    $("gtitle").textContent = "Game not found";
    $("gateTitle").textContent = "Game not found";
    $("gateThumb").classList.add("hidden");
    document.querySelector(".gate-stats").classList.add("hidden");
    startBtn.textContent = "Back to games";
    startBtn.onclick = () => (location.href = $("back").href);
    UI.bindTokenPill();
    $("infoBtn").classList.add("hidden");
    return;
  }

  document.title = g.title + " · Mini Games";
  $("gtitle").textContent = g.title;
  if (g.thumb) $("stageBg").style.backgroundImage = `url("${g.thumb}")`;
  $("gateThumb").innerHTML = thumbImg(g);
  $("gateTitle").textContent = g.title;
  $("gateCost").textContent = g.cost;
  $("gateHow").innerHTML = (g.howTo || []).map((s) => `<li>${esc(s)}</li>`).join("");

  // 已付费的这一局（防止刷新页面重复扣 TOKEN）
  let playing = false;                       // 已付费、游戏还没结束
  const TICKET = "mgs.ticket." + g.id;
  const hasTicket = () => { try { return !!sessionStorage.getItem(TICKET); } catch (e) { return false; } };
  const setTicket = (v) => { try { v ? sessionStorage.setItem(TICKET, String(Date.now())) : sessionStorage.removeItem(TICKET); } catch (e) {} };

  // 游戏还在后台载入时先不让按 Start：声音只能在「游戏已载入」时的那一下点击里启动
  let frameLoading = false;
  function updateGate() {
    $("gateBal").textContent = balance.toLocaleString();
    const enough = balance >= g.cost;
    startBtn.disabled = false;
    if (enough && frameLoading) { startBtn.disabled = true; startBtn.textContent = "Loading game…"; return; }
    startBtn.innerHTML = enough
      ? `${ICON.play.replace("<svg", '<svg width="18" height="18"')} Start · use ${g.cost} TOKEN`
      : "Not enough TOKEN";
    if (!enough) startBtn.disabled = true;
  }
  TokenService.onChange((b) => { balance = b; updateGate(); });
  UI.bindTokenPill();

  /* ---------- 游戏载入 ----------
     开始卡片出现时就先在后台载入游戏（?mgs_wait=1，游戏先不开局）。
     玩家按 Start 的同一下点击里启动游戏的声音（iPhone 只准「点一下」播放声音），
     扣完 TOKEN 再叫游戏开局。 */
  const gameUrl = (wait) => g.file + (g.file.includes("?") ? "&" : "?") + "v=28" + (wait ? "&mgs_wait=1" : "");
  let frameState = "none";            // none | loading | ready | started
  let startWhenReady = false;
  const frameMGS = () => { try { return frame.contentWindow.MGS || null; } catch (e) { return null; } };
  frame.addEventListener("load", () => {
    if (frameState !== "loading") return;
    // 忽略 iframe 一开始的空白页（about:blank）也会触发的 load
    try { if (frame.contentWindow.location.href === "about:blank") return; } catch (e) {}
    frameState = "ready";
    if (frameLoading) { frameLoading = false; updateGate(); }
    if (startWhenReady) { startWhenReady = false; startFrame(); }
  });
  function preload() {
    frameState = "loading"; frameLoading = true; updateGate();
    frame.src = gameUrl(true);
    // 万一载入太久（网络很慢），15 秒后还是让玩家可以开始
    setTimeout(() => { if (frameLoading) { frameLoading = false; updateGate(); } }, 15000);
  }
  function unlockFrameAudio() {
    const m = frameState === "ready" && frameMGS();
    if (m && m.unlockAudio) { try { m.unlockAudio(); } catch (e) {} }
  }
  function startFrame() {
    frameState = "started";
    const m = frameMGS();
    if (m && m.startNow) { try { m.unlockAudio(); m.startNow(); } catch (e) {} }
    else { try { frame.contentWindow.postMessage({ mgs: 1, type: "start" }, "*"); } catch (e) {} }
  }

  function launch() {
    gate.classList.add("hidden");
    $("againBtn").classList.remove("hidden");
    frame.classList.add("on");
    playing = true;
    if (frameState === "ready") startFrame();
    else if (frameState === "loading") startWhenReady = true;
    else { frameState = "started"; frame.src = gameUrl(false); }
  }

  async function pay() {
    err.textContent = "";
    startBtn.disabled = true;
    startBtn.textContent = "Starting…";
    try {
      await TokenService.spend(g.id, g.cost);
      setTicket(true);
      UI.notify({ kind: "spend", title: `−${g.cost} TOKEN`, sub: `Balance: ${balance.toLocaleString()} TOKEN · Good luck!` });
      launch();
    } catch (e) {
      gate.classList.remove("hidden");
      err.textContent = e.message === "INSUFFICIENT" ? "Not enough TOKEN." : "Could not start the game. Please try again.";
      updateGate();
    }
  }
  startBtn.onclick = () => { unlockFrameAudio(); pay(); };   // 声音要在这一下点击里启动

  /* ---------- 游戏中途离开：提醒 TOKEN 不退还 ---------- */
  const inProgress = () => playing;
  const WARN_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".5" fill="currentColor"/></svg>';
  const lostNote = () => `<div class="leave-q"><span class="lq-ico">${WARN_ICO}</span>
    <p>This game isn't finished yet. If you leave now, the <b class="gold">${g.cost} TOKEN</b> you used <b>will not be returned</b>.</p></div>`;

  $("back").addEventListener("click", (e) => {
    if (!inProgress()) return;
    e.preventDefault();
    openModal(g, {
      subtitle: "Game in progress",
      body: lostNote(),
      actions: [
        { label: "Leave anyway", cls: "btn-danger", onClick: () => { setTicket(false); playing = false; closeModal(); location.href = $("back").href; } },
        { label: "Keep playing", cls: "btn-gold", onClick: closeModal }
      ]
    });
  });
  // 浏览器返回键 / 关闭分页时也提醒
  window.addEventListener("beforeunload", (e) => {
    if (!inProgress()) return;
    e.preventDefault(); e.returnValue = "";
  });

  // 重玩：再扣一次 TOKEN
  $("againBtn").onclick = () => {
    openModal(g, {
      subtitle: `Play again for <span class="coin sm">T</span> ${g.cost} TOKEN?`,
      body: inProgress() ? lostNote().replace("If you leave now", "If you restart now") : "",
      actions: [
        { label: "Cancel", onClick: closeModal },
        { label: `Play again · ${g.cost}`, cls: "btn-gold", disabled: balance < g.cost,
          onClick: async () => { closeModal(); frameState = "none"; frame.src = "about:blank"; setTicket(false); await pay(); } }
      ]
    });
  };

  $("infoBtn").onclick = () => openModal(g, { actions: [{ label: "Got it", cls: "btn-gold", onClick: closeModal }] });

  /* ---------- 游戏通知（mgs-bridge.js） ---------- */
  UI.mountVoucherBar(document.getElementById("vbar"), { hideEmpty: true });
  const toGame = (msg) => { try { frame.contentWindow.postMessage(Object.assign({ mgs: 1 }, msg), "*"); } catch (e) {} };

  let lastVoucher = null;                     // 这一页最近赢到的 voucher
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.mgs !== 1 || e.source !== frame.contentWindow) return;

    if (d.type === "win") {
      lastVoucher = VoucherService.add({ gameId: g.id, gameTitle: g.title, amount: d.amount, code: d.code, label: d.label });
      setTicket(false); playing = false;      // 这一局结束
      UI.notify({ kind: "win", title: `You won ${d.label || VoucherService.fmt(d.amount)}!`, sub: "Voucher saved to My Vouchers" });
    }

    if (d.type === "claim") {                // 游戏里按 CLAIM NOW → 领取接口
      const v = (d.code && VoucherService.list().find((x) => x.code === d.code && x.gameId === g.id)) || lastVoucher;
      UI.claimVoucher(v);
    }

    if (d.type === "over") { setTicket(false); playing = false; }  // 输了，这一局结束

    if (d.type === "replay-request") {        // 输了按 Replay → 先扣 TOKEN
      const enough = balance >= g.cost;
      openModal(g, {
        subtitle: `Your balance: <span class="coin sm">T</span> ${balance.toLocaleString()} TOKEN`,
        body: `<p class="replay-q">${enough
          ? `Play again for <b class="gold">${g.cost} TOKEN</b>?`
          : `You need <b class="gold">${g.cost} TOKEN</b> to play again.`}</p>`,
        actions: [
          { label: enough ? "Cancel" : "Back to games", onClick: () => { if (enough) closeModal(); else location.href = $("back").href; } },
          { label: `Play again · ${g.cost}`, cls: "btn-gold", disabled: !enough, onClick: async () => {
              closeModal();
              try {
                await TokenService.spend(g.id, g.cost);
                setTicket(true); playing = true;
                UI.notify({ kind: "spend", title: `−${g.cost} TOKEN`, sub: `Balance: ${balance.toLocaleString()} TOKEN · Good luck!` });
                toGame({ type: "replay-ok", id: d.id });
              } catch (err) { toast(err.message === "INSUFFICIENT" ? "Not enough TOKEN." : "Could not start. Try again."); }
            } }
        ]
      });
    }
  });

  if (hasTicket()) launch(); else preload();

  /* ---------- 检测画面：网址加 &debug=1 ---------- */
  if (qs.get("debug") === "1") {
    const box = document.createElement("pre");
    box.style.cssText = "position:fixed;left:6px;right:6px;top:70px;z-index:999;margin:0;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.85);color:#7CFC9A;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;pointer-events:none";
    document.body.appendChild(box);
    const R = (el) => { if (!el) return "-"; const r = el.getBoundingClientRect(); return Math.round(r.top) + "→" + Math.round(r.bottom) + " (h" + Math.round(r.height) + ")"; };
    const show = () => {
      const de = document.documentElement, vv = window.visualViewport;
      let inner = "-";
      try { const w = frame.contentWindow; inner = w.innerHeight + " / doc " + w.document.documentElement.scrollHeight; } catch (e) { inner = "n/a"; }
      box.textContent = [
        "build v28",
        "iOS class: " + de.classList.contains("ios-safari") + "   app-h class: " + de.classList.contains("app-h"),
        "--app-h: " + getComputedStyle(de).getPropertyValue("--app-h"),
        "innerHeight: " + innerHeight + "   vv: " + (vv ? Math.round(vv.height) + " (top " + Math.round(vv.offsetTop) + ")" : "-"),
        "screen: " + screen.width + "x" + screen.height + "   dpr " + devicePixelRatio,
        "body: " + R(document.body) + "  pad-b " + getComputedStyle(document.body).paddingBottom,
        "stage: " + R(document.querySelector(".stage")),
        "frame: " + R(frame) + "   inside: " + inner,
        "UA: " + navigator.userAgent
      ].join("\n");
    };
    show(); setInterval(show, 1000);
  }
})();
</script>
</body>
</html>
